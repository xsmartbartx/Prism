# Prism on the shared NEXORA host, behind the shared edge Caddy.
#
# Deploy ONLY via the host's locking script (never `docker compose up` directly there):
#   /opt/nexora/infrastructure/deployment/deploy.sh prism
#
# No ports are published: the edge Caddy (edge-caddy-1) joins the `prism_default`
# network and proxies prism.onenexora.com -> prism-app-1:8080.
# The image is the published release (no build on the host).
#
# No secrets file is needed. On first start `init-secrets` writes a random database password
# into the private `secrets` volume (read by Postgres, and by Prism through a libpq passfile);
# Prism generates its own secret key in its data volume. Nobody, person or agent, ever sees
# either. Optional non-secret overrides (PRISM_VERSION, PRISM_LICENSE_KEY, ...) may go in an
# env file next to the checkout; see env.example.
name: prism

services:
  init-secrets:
    image: alpine:3.20
    restart: "no"
    network_mode: none
    volumes:
      - secrets:/secrets
      - pgdata:/pgdata:ro
    command:
      - sh
      - -ec
      - |
        umask 077
        if [ ! -s /secrets/db_password ]; then
          # A new password only fits a new database: Postgres keeps the password it was
          # initialised with, so refuse rather than lock Prism out of an existing one.
          if [ -s /pgdata/PG_VERSION ]; then
            echo "init-secrets: prism_pgdata exists but prism_secrets has no password." >&2
            echo "Restore the secrets volume, or set the password in Postgres and write it to" >&2
            echo "/secrets/db_password in prism_secrets, then start again." >&2
            exit 1
          fi
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/db_password.tmp
          mv /secrets/db_password.tmp /secrets/db_password
        fi
        chown 70:70 /secrets/db_password
        chmod 600 /secrets/db_password
        # Write the passfile beside the old one and rename it, so a running Prism never reads
        # a half-written file.
        printf 'postgres:5432:prism:prism:%s\n' "$$(cat /secrets/db_password)" > /secrets/pgpass.tmp
        chown 10001:10001 /secrets/pgpass.tmp
        chmod 600 /secrets/pgpass.tmp
        mv /secrets/pgpass.tmp /secrets/pgpass

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD_FILE: /secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  app:
    image: ghcr.io/xsmartbartx/prism:${PRISM_VERSION:-1.0.1}
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PRISM_ENV: production
      PRISM_BASE_URL: https://${PRISM_DOMAIN:-prism.onenexora.com}
      # libpq reads the password from the passfile (mode 600, owned by Prism's uid), so it is
      # never in the environment or the URL, and every `prism` command in the container uses it.
      PRISM_DATABASE_URL: postgresql+psycopg://prism@postgres:5432/prism?passfile=/secrets/pgpass
      PRISM_LICENSE_KEY: ${PRISM_LICENSE_KEY:-}
      PRISM_MAX_UPLOAD_MB: ${PRISM_MAX_UPLOAD_MB:-100}
      PRISM_LOG_LEVEL: ${PRISM_LOG_LEVEL:-INFO}
      # Only reachable through the edge Caddy on this network, which only accepts Cloudflare
      # (cloudflare_only), so Cloudflare's header names the real client for rate limiting.
      PRISM_FORWARDED_ALLOW_IPS: "*"
      PRISM_CLIENT_IP_HEADER: CF-Connecting-IP
    volumes:
      - data:/var/lib/prism # dataset versions (Parquet), uploads, secret key: back it up
      - secrets:/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g

volumes:
  pgdata:
  data:
  secrets:
