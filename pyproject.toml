[project]
name = "prism"
version = "1.0.0"
description = "Self-hosted data platform — import, model, query, and visualize data declaratively"
requires-python = ">=3.11"
authors = [
    { name = "xsmartbartx" },
]
dependencies = [
    "pyarrow>=17.0.0",
    "pydantic>=2.0.0",
    "babel>=2.14.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "duckdb>=1.1.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "cryptography>=43.0.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "build>=1.2.0",
    "setuptools>=75.0.0",
    "wheel>=0.43.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "data*", "presentation*", "security*", "insight*", "schemas*", "catalog*", "server*"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF", "DTZ", "BLE"]
ignore = ["E701", "E702", "RUF001", "RUF002", "RUF003", "RUF012", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501", "DTZ001"]
"server/migrations/**" = ["E501"]
"server/api/**" = ["B008"]

[tool.setuptools.package-data]
server = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "static/**/*", "samples/*.csv"]

[project.scripts]
prism = "server.cli:main"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]
