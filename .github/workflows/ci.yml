name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      # Ephemeral, job-local database reachable only from this runner;
      # trust auth avoids keeping any credential in the repository.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prism
          POSTGRES_USER: prism
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prism -d prism"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install locked dependencies (wheels only, hash-checked)
        run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements/ci.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy core/ data/ presentation/ catalog/ schemas/ server/ tools/

      - name: Tests (SQLite + PostgreSQL) with coverage
        env:
          PRISM_TEST_DATABASE_URL: postgresql+psycopg://prism@localhost:5432/prism
        run: |
          pytest --cov=core --cov=data --cov=presentation --cov=catalog --cov=schemas --cov=server \
            --cov-report=term-missing --cov-fail-under=88

      - name: Build wheel
        run: python -m build --wheel --no-isolation

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: docker build -f deploy/Dockerfile -t prism:ci .
      - name: Smoke test (read-only, non-root)
        run: |
          docker run -d --name prism --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -p 8080:8080 prism:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/readyz
          curl -fs http://localhost:8080/api/v1/setup/status | grep -q needs_setup
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
          docker exec prism prism backup
          docker logs prism | tail -5
